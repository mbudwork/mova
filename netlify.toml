# =============================================================================
# MOVA — конфигурация Netlify
#
# В репозитории лежит vercel.json, и на Netlify он не читается вообще. Вместе
# с ним терялись три заголовка, в том числе X-Robots-Tag: noindex — то есть
# review-сборка на Netlify была бы открыта для индексации, хотя в коде стоит
# защита. Этот файл возвращает те же заголовки на Netlify.
#
# Плагин @netlify/plugin-nextjs здесь намеренно не объявлен: Netlify ставит
# Next.js Runtime сам, когда видит next в зависимостях. Явное объявление
# добавляет ещё одну версию, которую придётся сопровождать вручную.
# =============================================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 16 требует Node 20+. Пин на 22, чтобы сборка на Netlify совпадала
  # с той, что проверялась локально.
  NODE_VERSION = "22"

# --------------------------------------------------------------- ЗАГОЛОВКИ --
# Полный аналог блока headers из vercel.json.
[[headers]]
  for = "/*"
  [headers.values]
    # X-Robots-Tag убран: сайт открыт для поисковиков. Запрет стоял с тех пор,
    # когда это была review-сборка, и снимать его нужно было в ДВУХ местах —
    # здесь и в src/app/robots.ts. Одного мало: заголовок действует, даже если
    # краулер не читал robots.txt.
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
